<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal Komponens - OOP</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
        background: #f0f2f5;
      }

      /* Modal Háttér (Backdrop) */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .modal-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      /* Modal doboz */
      .modal-box {
        background: white;
        padding: 30px;
        border-radius: 8px;
        width: 400px;
        max-width: 90%;
        position: relative;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
      }
      .open-modal-btn {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <button class="open-modal-btn" id="open-btn">Modal Megnyitása</button>

      <div class="modal-overlay" id="my-modal">
        <div class="modal-box">
          <button class="close-btn" id="close-btn">&times;</button>
          <h2>OOP Modal Ablak</h2>
          <p>
            Ez egy dinamikusan vezérelt felugró ablak JavaScript osztályokból.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
