<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://kit.fontawesome.com/bd0f8cc967.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="opponent">
      <div id="opponent-rock" class="inv">
        <i class="fa-solid fa-hand-back-fist"></i>
      </div>
      <div id="opponent-paper" class="inv">
        <i class="fa-solid fa-hand, inv"></i>
      </div>
      <div id="oppenent-scissors" class="inv">
        <i class="fa-regular fa-hand-scissors, inv"></i>
      </div>
    </div>
    <div id="userfield">
      <div id="choices">
        <button id="rock" class="inv" value="1">
          <i class="fa-solid fa-hand-back-fist"></i>
        </button>
        <button id="paper" class="inv" value="2">
          <i class="fa-solid fa-hand"></i>
        </button>
        <button id="scissors" class="inv" value="3">
          <i class="fa-regular fa-hand-scissors"></i>
        </button>
      </div>
      <div id="confirm" class="inv">
        <button>confirm</button>
      </div>
    </div>

    <button id="start">Start</button>
    <script src="main.js"></script>
  </body>
</html>
