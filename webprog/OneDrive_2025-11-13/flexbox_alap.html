<!DOCTYPE html>
<html>
	<head>
		<style>
		.container
		{
			background-color: lightBlue;
			display: flex;
			flex-flow: row wrap;
			justify-items: center;
			align-items: center;
			width: 60%;
			height: 500px;
			margin-left: auto;
			justify-content: space-between;
			margin-right: auto;
			align-content: space-evenly;
		}

		.container div 
		{
			background-color: #f1f1f1;
			margin: 10px;
			padding: 20px;
			font-size: 24px;
		}
		</style>
	</head>
<body>

<h1>Flexbox</h1>

<div class="container">
  <div>Elem 1</div>
  <div>Elem 2</div>
  <div>Elem 3</div>  
  <div>Elem 4</div>
  <div>Elem 5</div>
</div>



</body>
</html>
